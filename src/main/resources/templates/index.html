<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Student List</h1>

    <a href="/students/new" class="btn btn-primary mb-3">+ Add New Student</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>First Name</th><th>Last Name</th>
                <th>Email</th><th>Course</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.firstName}"></td>
                <td th:text="${student.lastName}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.course}"></td>
                <td>
                    <a th:href="@{'/students/edit/' + ${student.id}}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{'/students/delete/' + ${student.id}}"
                       onclick="return confirm('Are you sure you want to delete this student?')"
                       class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
